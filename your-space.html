<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#23382E"><title>Your Space · Personal Project HQ</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f1eb;color:#304137;font-family:Arial,sans-serif}main{max-width:850px;margin:auto;padding:22px 20px 65px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:14px}.top a{color:#304137;text-decoration:none;font-size:13px;font-weight:600}.top span{font-size:12px;letter-spacing:.1em}.hq-head{padding:14px 0 25px}.hq-head h1{font-family:Georgia,serif;font-size:clamp(38px,8vw,54px);letter-spacing:-.045em;margin:7px 0}.hq-head p{color:#686b62;margin:0}.hq-kicker{display:block;font-size:11px;letter-spacing:.12em;font-weight:700;color:#667164}.hq-editorial-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.hq-card{position:relative;display:flex;flex-direction:column;gap:13px;min-width:0;min-height:148px;border:1px solid #d7cfc0;border-radius:21px;padding:21px 18px;text-decoration:none;color:#304137;background:#f9f5ec}.hq-card strong{font-family:Georgia,serif;font-size:clamp(21px,4vw,29px);line-height:1.13;font-weight:600}.hq-card strong small{font:400 14px Arial,sans-serif}.hq-sub{font-size:13px;line-height:1.5;color:#6e746b}.hq-arrow{position:absolute;right:16px;top:15px;font-size:19px;color:#8b7562}.hq-today,.hq-garden,.hq-wellbeing{grid-column:span 2}.hq-today{background:#294536;color:#f7f1e6;padding:25px}.hq-today .hq-kicker,.hq-today .hq-sub{color:#e3e4d9}.hq-today strong{font-size:39px}.hq-money{background:#eee2d4}.hq-garden{background:#e4eadb}.hq-garden-body{display:flex;align-items:center;gap:20px}.hq-garden-body>span:last-child{display:flex;flex-direction:column;gap:9px}.hq-ring{--progress:0%;width:94px;height:94px;flex:none;border-radius:50%;background:conic-gradient(#658565 var(--progress),#c8d5c1 0);display:grid;place-items:center}.hq-ring>span{display:grid;place-items:center;width:74px;height:74px;border-radius:50%;background:#e4eadb;font-weight:700}.hq-ring-empty{font-size:35px}.hq-bar{display:block;height:7px;background:#d5d8cb;border-radius:10px;overflow:hidden;margin-top:auto}.hq-bar i{display:block;height:100%;background:#718d71;border-radius:10px}.hq-today .hq-bar{background:#5b7161}.hq-today .hq-bar i{background:#dfc79e}.hq-section-label{grid-column:span 2;font-size:12px;letter-spacing:.12em;color:#687369;font-weight:700;padding:13px 2px 0}.hq-wellbeing{background:#f0e6df}.hq-card:focus-visible{outline:3px solid #ad7852;outline-offset:3px}#status{color:#686b62;font-size:13px}@media(max-width:360px){.hq-editorial-grid{gap:9px}.hq-card{padding:18px 13px}.hq-card strong{font-size:21px}}

/* Your Space: coordinated with the Health & Wellbeing palette */
body{background:#f1ede4;color:#34533e;background-image:repeating-linear-gradient(35deg,rgba(130,112,91,.025) 0px,rgba(130,112,91,.025) 1px,transparent 1px,transparent 7px)}
.hq-head h1{color:#34533e;font-weight:400;letter-spacing:-.035em}
.hq-head p,.hq-sub{color:#758171}
.hq-kicker,.hq-section-label{color:#728570}
.hq-card{background:#faf8f2;border:1px solid #e0e1d6;border-radius:24px;color:#35553e;box-shadow:0 2px 9px rgba(58,55,44,.025);min-height:142px}
.hq-card strong{font-weight:400}
.hq-card .hq-arrow{font-size:0;color:#789079}
.hq-card .hq-arrow::before{content:'↗';font:normal 22px Georgia,serif}
.hq-today{background:#e7e6d9;color:#35553e}
.hq-today .hq-kicker{color:#728570}
.hq-today .hq-sub{color:#677568}
.hq-today strong{font-weight:400}
.hq-today .hq-bar{background:#d5d7c9}
.hq-today .hq-bar i{background:#799779}
.hq-money{background:#e8ddd2;color:#784e4b}
.hq-money .hq-kicker,.hq-money .hq-sub{color:#835e59}
.hq-garden{background:#e2e8db}
.hq-wellbeing{background:#d4bba8;color:#714943}
.hq-wellbeing .hq-kicker,.hq-wellbeing .hq-sub{color:#714943}
.hq-coming{background:#eee6db;color:#714943}
.hq-reminders{background:#e0dfd1}
.hq-meals{background:#f7f5ed}
.hq-project-card:nth-of-type(odd){background:#f7f5ed}
.hq-project-card:nth-of-type(even){background:#e9e1d6}
.hq-ring{background:conic-gradient(#789579 var(--progress),#cad5c4 0)}
.hq-ring>span{background:#e2e8db;color:#35553e}
.hq-bar{background:#d9d8ce}.hq-bar i{background:#7d987e}
.top a{color:#405743}

/* Compact, information-first dashboard revision */
main{padding:14px 16px 42px}
.top{padding:4px 0 7px}
.top span{font-size:10px}
.top a{font-size:12px}
.hq-head{padding:6px 0 14px}

.hq-today .hq-bar{margin-top:2px}
.hq-garden{grid-column:span 2}
.hq-garden-body{gap:13px}

.hq-ring{width:66px;height:66px}
.hq-ring>span{width:51px;height:51px;font-size:14px}
.hq-section-label{padding:6px 1px 0;font-size:10px}
.hq-wellbeing{grid-column:span 2}
.hq-money{background:#e6d8cb}
.hq-today{background:#e8e5d9}
.hq-garden{background:#e2e8dd}
.hq-coming{background:#d5bfad}
.hq-reminders{background:#eee9dd}
.hq-meals{background:#f8f6f0}
#status:empty{display:none}
@media(min-width:600px){main{padding-left:24px;padding-right:24px}.hq-today,.hq-garden,.hq-wellbeing{grid-column:span 1}}

/* Richer, more cohesive editorial overview */
body{background:#f0ebe2;background-image:none}
main{max-width:740px;padding:16px 17px 50px}

</style></head><body><main><header class="top"><span>HQ / YOUR SPACE</span><a href="./index.html#week">Main app ↗</a></header><nav class="hq-nav" aria-label="Quick navigation"><a href="./index.html#week">Planner</a><a href="./index.html#projects">Projects</a><a href="./index.html#money">Money</a><a href="./index.html#meals">Meals</a><a href="./index.html#reminders">Reminders</a></nav><p id="status" role="status" hidden>Preparing your dashboard…</p><div id="editorial"><div class="hq-head"><span class="hq-kicker">PERSONAL PROJECT HQ</span><h1>Your Space</h1><p>Your life, at a glance.</p></div><div class="hq-editorial-grid"><a class="hq-card hq-today" href="./index.html#week"><span class="hq-kicker">TODAY · YOUR PLANNER</span><strong>Today’s tasks</strong></a><a class="hq-card hq-wellbeing" href="./index.html#project/Health%20%26%20Fitness"><span class="hq-kicker">HEALTH & WELLBEING</span><strong>Your wellbeing</strong></a><a class="hq-card hq-money" href="./index.html#money"><span class="hq-kicker">YOUR MONEY</span><strong>Balance</strong></a><a class="hq-card hq-garden" href="./index.html#project/Garden"><span class="hq-kicker">GARDEN PROGRESS</span><strong>Your milestones</strong></a><a class="hq-card hq-coming" href="./index.html#coming"><span class="hq-kicker">COMING UP</span><strong>Events</strong></a></div></div></main><script>
window.addEventListener('error',()=>{const e=document.getElementById('status');if(e&&!e.hidden)e.textContent='The dashboard could not start. Please open this link in Safari and refresh.';});
window.addEventListener('unhandledrejection',()=>{const e=document.getElementById('status');if(e&&!e.hidden)e.textContent='The dashboard could not finish loading. Please try Safari.';});
setTimeout(()=>{const e=document.getElementById('status');if(e&&!e.hidden)e.innerHTML='Still loading? <a href="./index.html#week">Return to your planner</a>, or open this page directly in Safari.';},12000);
</script><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
import {createEditorialDashboard} from './js/editorial-dashboard.js?v=4';
import {createTaskRepository} from './js/task-repository.js';
const client=createClient('https://rilqlmsojlplbaoxkztc.supabase.co','sb_publishable_3jueoHvfgcnIlCkVpRKwWQ_6iWLG627');
const projects=[['Garden','Garden'],['Book Nook','Book Nook'],['Christmas','Christmas Planning'],['Wellbeing','Health & Fitness'],['Home Projects','Home Projects'],['Other','Other']].map(([name,value])=>({name,value}));
const status=document.getElementById('status');
try {
 const {data,error}=await client.auth.getSession();if(error)throw error;
 if(!data.session){status.innerHTML='Please <a href="./index.html#week">sign in on your main app</a> first.';}
 else {status.hidden=true;const dashboard=createEditorialDashboard({root:document.getElementById('editorial'),client,projects,getTasks:()=>[]});await dashboard.refresh();status.hidden=true;createTaskRepository(client).list().then(tasks=>{const fresh=createEditorialDashboard({root:document.getElementById('editorial'),client,projects,getTasks:()=>tasks});return fresh.refresh();}).catch(()=>{});}
}catch(e){status.textContent='Could not load the dashboard: '+(e.message||'Please try again.');}
</script></body></html>
