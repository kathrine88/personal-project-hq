name: Push RPC regression
on:
  pull_request:
    paths:
      - 'docs/PUSH_TEST_CLAIM_FIX.sql'
      - 'migrations/**'
      - 'supabase/functions/reminder-push/**'
      - 'js/push-settings.js'
      - 'tests/push*.test.mjs'
      - '.github/workflows/push-regression.yml'
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install isolated Postgres test runtime (no live credentials)
        run: npm install --prefix "$RUNNER_TEMP/push-test" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
      - name: Reproduce original SQL bug and verify repaired RPCs and handler
        run: |
          export PGLITE_MODULE="file://$RUNNER_TEMP/push-test/node_modules/@electric-sql/pglite/dist/index.js"
          node --test tests/push-database.test.mjs tests/push.test.mjs
      - name: Temporary isolated-runtime debugging artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: push-db-runtime
          path: ${{ runner.temp }}/push-test/node_modules/@electric-sql/pglite
          retention-days: 1
