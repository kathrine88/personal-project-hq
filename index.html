

<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Personal Project HQ</title>

  <style>

    body {

      font-family: -apple-system, BlinkMacSystemFont, sans-serif;

      background: #f6f5ef;

      color: #303d32;

      margin: 0;

      padding: 30px 20px;

    }

    main {

      max-width: 480px;

      margin: 50px auto;

    }

    h1 { font-family: Georgia, serif; }

    .card {

      background: white;

      border-radius: 18px;

      padding: 25px;

      margin-top: 25px;

      box-shadow: 0 4px 20px #0000000a;

    }

    input, button {

      box-sizing: border-box;

      width: 100%;

      padding: 14px;

      margin: 8px 0;

      border-radius: 9px;

      font-size: 16px;

    }

    input { border: 1px solid #ccc; }

    button {

      background: #526b51;

      color: white;

      border: none;

      cursor: pointer;

    }

    #dashboard { display: none; }

    #message { overflow-wrap: anywhere; }

    li {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin: 16px 0;
  line-height: 1.5;
}

li input[type="checkbox"] {
  flex-shrink: 0;
  width: 20px;
  height: 20px;
  margin-top: 3px;
  accent-color: #526b51;
}

  </style>

</head>

<body>

  <main>

    <h1>Personal Project HQ</h1>

    <p>My little corner for organising everything.</p>

    <section class="card" id="login">

      <h2>Welcome back</h2>

      <form id="loginForm">

        <input id="email" type="email"

          placeholder="Email address" required>

        <input id="password" type="password"

          placeholder="Password" required>

        <button type="submit">Sign in</button>

      </form>

    </section>

 <section class="card" id="dashboard">
  <h2>My garden tasks</h2>


<form id="taskForm">
  <select id="newProject" required>
    <option value="Garden">Garden</option>
    <option value="Book Nook">Book Nook</option>
    <option value="Christmas Planning">Christmas Planning</option>
    <option value="Health & Fitness">Health & Fitness</option>
    <option value="Home Projects">Home Projects</option>
    <option value="Other">Other</option>
  </select>

  <input
    id="newTask"
    type="text"
    placeholder="What needs doing?"
    required
  >

  <button type="submit">+ Add task</button>
</form>


  <ul id="tasks"></ul>

  <button id="logout">Sign out</button>
</section>

    <p id="message" role="status"></p>

  </main>

  <script type="module">

    import { createClient } from

      "https://esm.sh/@supabase/supabase-js@2";

    const supabaseUrl = "https://rilqlmsojlplbaoxkztc.supabase.co";

    const supabaseKey = "sb_publishable_3jueoHvfgcnIlCkVpRKwWQ_6iWLG627";

    const supabase = createClient(supabaseUrl, supabaseKey);

    const login = document.getElementById("login");

    const dashboard = document.getElementById("dashboard");

    const message = document.getElementById("message");

    const tasks = document.getElementById("tasks");

    async function showDashboard() {

      login.style.display = "none";

      dashboard.style.display = "block";

      tasks.replaceChildren();

      message.textContent = "Loading your tasks...";

      const { data, error } = await supabase

        .from("test_tasks")

        .select("id, project, task, completed")

        .order("id");

      if (error) {

        message.textContent = "Error: " + error.message;

        return;

      }

      
for (const item of data) {
  const li = document.createElement("li");

  const checkbox = document.createElement("input");
  checkbox.type = "checkbox";
  checkbox.checked = item.completed;
  checkbox.style.width = "auto";
  checkbox.style.marginRight = "12px";

  const label = document.createElement("span");
  label.textContent = item.project + " — " + item.task;

  if (item.completed) {
    label.style.textDecoration = "line-through";
    label.style.opacity = "0.5";
  }

  checkbox.addEventListener("change", async () => {
    checkbox.disabled = true;
    message.textContent = "Saving...";

    const { error } = await supabase
      .from("test_tasks")
      .update({ completed: checkbox.checked })
      .eq("id", item.id);

    if (error) {
      checkbox.checked = !checkbox.checked;
      checkbox.disabled = false;
      message.textContent = "Error: " + error.message;
      return;
    }

    await showDashboard();
  });

  li.appendChild(checkbox);
  li.appendChild(label);
  tasks.appendChild(li);
}


      message.textContent = data.length

        ? "Your tasks are ready!"

        : "No tasks found.";

    }

    async function refreshSession() {

      const { data } = await supabase.auth.getSession();

      if (data.session) await showDashboard();

    }

    document.getElementById("loginForm")

      .addEventListener("submit", async (event) => {

        event.preventDefault();

        message.textContent = "Signing in...";

        const email = document.getElementById("email").value;

        const password = document.getElementById("password").value;

        const { error } = await supabase.auth

          .signInWithPassword({ email, password });

        if (error) {

          message.textContent = error.message;

          return;

        }

        document.getElementById("password").value = "";

        await showDashboard();

      });
document.getElementById("taskForm")
  .addEventListener("submit", async (event) => {
    event.preventDefault();

    const input = document.getElementById("newTask");
    const taskName = input.value.trim();
const projectName = document.getElementById("newProject").value;
    
    if (!taskName) return;

    message.textContent = "Saving your task...";

    const { error } = await supabase
      .from("test_tasks")
 .insert({
  project: projectName,
  task: taskName
});

    if (error) {
      message.textContent = "Error: " + error.message;
      return;
    }

    input.value = "";
    await showDashboard();
  });
    document.getElementById("logout")

      .addEventListener("click", async () => {

        await supabase.auth.signOut();

        dashboard.style.display = "none";

        login.style.display = "block";

        tasks.replaceChildren();

        message.textContent = "Signed out.";

      });

    refreshSession();

  </script>

</body>

</html>
