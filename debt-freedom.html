<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Debt Freedom · Personal Project HQ</title><style>
*{box-sizing:border-box}body{margin:0;background:#eee9e0;color:#653f40;font:14px/1.5 system-ui,sans-serif}main{max-width:700px;margin:auto;padding:20px 16px 60px}h1,h2,.number{font-family:Georgia,serif;font-weight:400}h1{font-size:39px;margin:8px 0}h2{font-size:24px;margin:0 0 10px}a{color:#36513d}.head{background:#294638;color:#fff8ed;padding:23px;border-radius:18px;margin:16px 0}.head small{letter-spacing:.14em}.head p{margin:0;color:#e7e1d3}.nav{display:flex;justify-content:space-between;gap:12px}.nav a{font-size:12px}.panel{background:#f9f6ef;border:1px solid #e2d7ca;border-radius:17px;padding:18px;margin:12px 0}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.summary .panel{margin:0;background:#dfd0c2}.summary .number{font-size:26px}.muted{color:#826b66;font-size:12px}.account{background:#e5d9cb;border-radius:16px;padding:17px;margin:10px 0}.account h2{margin-bottom:4px}.account .number{font-size:29px}.bar{height:9px;border-radius:9px;background:#c7b7a8;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:#965e58}form{display:grid;gap:9px}label{display:grid;gap:4px;font-size:12px;font-weight:600}input,select{width:100%;min-width:0;padding:10px;border:1px solid #cfc4b9;background:#fffdf9;border-radius:9px;color:#4c3f3b;font:inherit}button{border:0;background:#294638;color:#fff8ef;border-radius:9px;padding:11px 13px;font:600 13px system-ui}button:disabled{opacity:.6}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.history{padding-left:18px}.history li{padding:7px 0;border-bottom:1px solid #e4d9cd}#message{min-height:20px;color:#8c4a43}.empty{color:#7c6a63}</style></head><body><main><div class="nav"><a href="./your-space.html">← Your Space</a><a href="./index.html#money">Money section</a></div><div class="head"><small>PERSONAL PROJECT HQ</small><h1>Debt Freedom</h1><p>Every payment is progress.</p></div><p id="message" role="status">Connecting to your records…</p><section class="summary"><div class="panel"><div class="muted">TOTAL REMAINING</div><div class="number" id="remaining">—</div></div><div class="panel"><div class="muted">PAID OFF</div><div class="number" id="paid">—</div></div></section><div id="accounts"></div><section class="panel"><h2>Add a debt</h2><form id="addAccount"><div class="row"><label>Type<select name="kind"><option value="credit_card">Credit card</option><option value="overdraft">Overdraft</option></select></label><label>Current balance (£)<input name="opening" type="number" min="0" step=".01" required inputmode="decimal"></label></div><label>Name<input name="name" maxlength="80" placeholder="e.g. Credit card" required></label><button type="submit">Start tracking</button></form></section><section class="panel" id="entryPanel" hidden><h2>Record a change</h2><form id="addEntry"><label>Debt<select name="account" id="accountSelect" required></select></label><div class="row"><label>Type<select name="kind"><option value="payment">Payment made</option><option value="interest">Interest added</option><option value="charge">Fee or charge</option><option value="borrowing">New spending / borrowing</option></select></label><label>Amount (£)<input name="amount" type="number" min=".01" step=".01" required inputmode="decimal"></label></div><div class="row"><label>Date<input name="date" type="date" required></label><label>Note (optional)<input name="note" maxlength="200" placeholder="e.g. October payment"></label></div><button type="submit">Save entry</button></form></section></main><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const client=createClient('https://rilqlmsojlplbaoxkztc.supabase.co','sb_publishable_3jueoHvfgcnIlCkVpRKwWQ_6iWLG627');
const el=id=>document.getElementById(id),gbp=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(n/100),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),pence=v=>Math.round(Number(v)*100);
let user=null,accounts=[],entries=[];
el('addEntry').elements.date.value=new Date().toLocaleDateString('en-CA');
async function refresh(){const [a,e]=await Promise.all([client.from('hq_debt_accounts').select('*').order('created_at'),client.from('hq_debt_entries').select('*').order('entry_date',{ascending:false}).order('created_at',{ascending:false})]);if(a.error||e.error)throw a.error||e.error;accounts=a.data||[];entries=e.data||[];let total=0,paid=0;el('accounts').innerHTML=accounts.map(account=>{const log=entries.filter(x=>x.account_id===account.id),payments=log.filter(x=>x.kind==='payment').reduce((n,x)=>n+Number(x.amount_pence),0),additions=log.filter(x=>x.kind!=='payment').reduce((n,x)=>n+Number(x.amount_pence),0),balance=Math.max(0,Number(account.opening_pence)+additions-payments),progress=(Number(account.opening_pence)+additions)>0?Math.min(100,Math.round(payments/(Number(account.opening_pence)+additions)*100)):100;total+=balance;paid+=Math.min(payments,Number(account.opening_pence)+additions);return '<section class="account"><div class="muted">'+(account.kind==='credit_card'?'CREDIT CARD':'OVERDRAFT')+'</div><h2>'+esc(account.name)+'</h2><div class="number">'+gbp(balance)+'</div><div class="bar"><i style="width:'+progress+'%"></i></div><div class="muted">'+progress+'% repaid · '+gbp(payments)+' in payments</div><details><summary>Payment & charge history ('+log.length+')</summary>'+(log.length?'<ul class="history">'+log.map(x=>'<li>'+esc(x.entry_date)+' · '+esc(x.kind)+' · '+gbp(x.amount_pence)+(x.note?' — '+esc(x.note):'')+'</li>').join('')+'</ul>':'<p>No entries yet.</p>')+'</details></section>'}).join('')||'<p class="empty">Add your credit card and overdraft below to begin.</p>';el('remaining').textContent=gbp(total);el('paid').textContent=gbp(paid);el('entryPanel').hidden=!accounts.length;el('accountSelect').innerHTML=accounts.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');el('message').textContent='';}
async function submit(form,table,build){const btn=form.querySelector('button');btn.disabled=true;el('message').textContent='Saving…';try{const {error}=await client.from(table).insert(build(new FormData(form)));if(error)throw error;form.reset();if(form.id==='addEntry')form.elements.date.value=new Date().toLocaleDateString('en-CA');await refresh();}catch(e){el('message').textContent='Could not save: '+(e.message||'Please retry');}finally{btn.disabled=false;}}
el('addAccount').addEventListener('submit',e=>{e.preventDefault();submit(e.currentTarget,'hq_debt_accounts',f=>({owner_id:user.id,kind:f.get('kind'),name:String(f.get('name')).trim(),opening_pence:pence(f.get('opening'))}));});
el('addEntry').addEventListener('submit',e=>{e.preventDefault();submit(e.currentTarget,'hq_debt_entries',f=>({owner_id:user.id,account_id:f.get('account'),kind:f.get('kind'),amount_pence:pence(f.get('amount')),entry_date:f.get('date'),note:f.get('note')||''}));});
try{const {data,error}=await client.auth.getUser();if(error||!data.user)throw new Error('Please sign in to your main app in this browser first.');user=data.user;await refresh();}catch(e){el('message').textContent=e.message;}
</script></body></html>
